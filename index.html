<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>타자 연습 · Typing Practice</title>
<meta name="description" content="초보자를 위한 타자 연습: 자리, 단어, 문장 연습 (한국어, English)">
<style>
@font-face{font-family:'NanumSquare Neo';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/NanumSquareNeo-bRg.woff') format('woff');}
@font-face{font-family:'NanumSquare Neo';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/NanumSquareNeo-cBd.woff') format('woff');}
:root{
  --bg1:#eef3ff; --bg2:#fff0f6; --card:#ffffff; --text:#1f2536; --mute:#7a8396; --line:#e4e8f1;
  --ok:#17a35f; --okbg:rgba(23,163,95,.13); --bad:#e0443f; --badbg:rgba(224,68,63,.14);
  --acc:#4f6df5; --accbg:rgba(79,109,245,.13); --star:#ffb400; --shadow:0 8px 28px rgba(60,80,140,.12);
}
@media (prefers-color-scheme:dark){
  :root{--bg1:#10142a;--bg2:#1d1233;--card:#1a1f33;--text:#eceff8;--mute:#98a1b8;--line:#2b3350;
        --ok:#52d08c;--okbg:rgba(82,208,140,.16);--bad:#ff7b76;--badbg:rgba(255,123,118,.2);
        --acc:#8aa0ff;--accbg:rgba(138,160,255,.18);--shadow:0 8px 28px rgba(0,0,0,.35);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  font-family:'NanumSquare Neo','NanumSquareNeo','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.3px}
.seg{display:inline-flex;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:3px}
.seg button{border:0;background:transparent;color:var(--mute);padding:8px 14px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.btn{border:0;background:var(--card);color:var(--text);border-radius:12px;padding:11px 16px;font:inherit;font-size:15px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--acc);color:#fff;font-weight:700}
.btn.fix{background:var(--bad);color:#fff;font-weight:700}
.btn.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,68,63,.5)}50%{box-shadow:0 0 0 9px rgba(224,68,63,0)}}

/* home */
.hello{margin:6px 2px 16px}
.hello h2{margin:0 0 4px;font-size:24px;letter-spacing:-.4px}
.hello p{margin:0;color:var(--mute);font-size:15px}
.cards{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);
  border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer;width:100%;transition:transform .1s}
.mode:active{transform:scale(.985)}
.mode .ic{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px}
.mode b{display:block;font-size:19px;margin-bottom:3px}
.mode span{color:var(--mute);font-size:14px}
.mode .pg{margin-left:auto;font-size:13px;color:var(--acc);white-space:nowrap;font-weight:700}

/* play */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .ttl{font-weight:800;font-size:17px;flex:1}
.top .cnt{color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:4px}
.chip{flex:none;border:0;background:var(--card);color:var(--mute);border-radius:20px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow)}
.chip.on{background:var(--acc);color:#fff;font-weight:700}
.chip i{font-style:normal;color:var(--star);margin-left:4px;letter-spacing:1px}
.chip.on i{color:#ffe27a}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#a07bff);border-radius:6px;transition:width .2s}
.card{position:relative;background:var(--card);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .15s}
.card.focus{border-color:var(--acc)}
.card.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* keys mode */
.kp{text-align:center}
.kbig{font-size:92px;font-weight:800;line-height:1;margin:2px 0 8px;color:var(--acc)}
.kfing{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.kfing u{width:16px;height:16px;border-radius:50%;display:inline-block;text-decoration:none}
.kmsg{margin-top:8px;min-height:22px;font-size:14.5px;color:var(--mute)}
.kmsg.bad{color:var(--bad);font-weight:700}
.kb{--k:clamp(24px,calc((min(100vw,760px) - 96px)/11),54px);margin:16px auto 0;display:flex;flex-direction:column;gap:6px;align-items:center;user-select:none}
.krow{display:flex;gap:6px}
.krow:nth-child(2){margin-left:calc(var(--k)*.55)}
.krow:nth-child(3){margin-left:calc(var(--k)*1.3)}
.key{position:relative;width:var(--k);height:calc(var(--k)*1.15);border:0;border-radius:calc(var(--k)*.22);color:#1f2536;
  font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .06s}
.key b{font-size:calc(var(--k)*.46)}
.key small{font-size:calc(var(--k)*.26);opacity:.6;margin-top:2px;text-transform:uppercase}
.key.home::after{content:"";position:absolute;bottom:calc(var(--k)*.1);width:34%;height:3px;border-radius:2px;background:rgba(0,0,0,.4)}
.key.dim{opacity:.38}
.key.target{outline:4px solid var(--acc);outline-offset:2px;animation:glow 1s infinite;z-index:1}
@keyframes glow{50%{transform:translateY(-3px) scale(1.07)}}
.key.ok{background:#6fe3a2!important}
.key.bad{background:#ff8d88!important;animation:shake .25s}

/* text mode */
.lab{font-size:12.5px;color:var(--mute);margin:0 0 6px;font-weight:700}
.line{font-size:26px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:.3px;min-height:46px;user-select:none}
.line.tg{margin-bottom:14px}
.srcl{font-size:12.5px;color:var(--mute);margin:-6px 2px 12px;min-height:16px;text-align:right}
.line span{border-radius:5px}
.tg span{color:var(--mute)}
.tg .ok{color:var(--ok)}
.tg .bad{color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
.tg .cur{background:var(--accbg);color:var(--text);box-shadow:inset 0 -3px 0 var(--acc)}
.ty{background:var(--bg1);border-radius:14px;padding:8px 14px;min-height:62px;display:flex;align-items:center}
@media (prefers-color-scheme:dark){.ty{background:rgba(255,255,255,.05)}}
.ty .in{flex:1}
.ty .ok{color:var(--ok)}
.ty .bad{color:var(--bad);background:var(--badbg)}
.ty .pend{color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.ty .ph{color:var(--mute);font-size:16px}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--acc);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ty.good{box-shadow:inset 0 0 0 2px var(--ok);background:var(--okbg)}
.ty.err{box-shadow:inset 0 0 0 2px var(--bad)}
#inp{position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;border:0;outline:0;padding:0;margin:0;font-size:16px;overflow:hidden;cursor:text}
.msg{margin:12px 2px 0;min-height:24px;font-size:15px;color:var(--mute);text-align:center}
.msg.bad{color:var(--bad);font-weight:700}
.msg.good{color:var(--ok);font-weight:700}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* result */
.ov{position:fixed;inset:0;background:rgba(15,20,40,.55);display:grid;place-items:center;padding:18px;z-index:10}
.res{background:var(--card);border-radius:24px;padding:26px 22px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow)}
.stars{font-size:46px;letter-spacing:6px;color:var(--star);line-height:1}
.stars s{text-decoration:none;color:var(--line)}
.res h3{margin:12px 0 4px;font-size:22px}
.res .sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.rs div{background:var(--bg1);border-radius:14px;padding:10px 4px}
@media (prefers-color-scheme:dark){.rs div{background:rgba(255,255,255,.06)}}
.rs b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.rs span{font-size:11.5px;color:var(--mute)}
.rb{display:flex;flex-direction:column;gap:8px}
.rb .btn{box-shadow:none;border:1px solid var(--line)}
.rb .btn.main{border-color:transparent}

/* user chip + panel */
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.regbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;border-radius:14px;border:2px solid #f5a623;background:#fff7e6;color:#5a3b00;font-weight:700}
.regbar[hidden]{display:none}
.regbar .btn{background:#f5a623;color:#fff;border-color:#f5a623}
.ubtn{padding:8px 12px;font-size:14px;border-radius:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res.up{max-width:420px;text-align:left;max-height:90vh;overflow:auto}
.res.up h3{margin:0 0 4px}
.ulist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.urow{display:flex;gap:8px;align-items:center}
.urow .pick{flex:1;text-align:left;display:flex;align-items:center;gap:8px;box-shadow:none;border:2px solid var(--line);padding:10px 14px;min-width:0}
.urow .pick.on{border-color:var(--acc);background:var(--accbg);font-weight:700}
.urow .pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .pick em{margin-left:auto;font-style:normal;font-size:12px;color:var(--acc)}
.urow .del{box-shadow:none;border:1px solid var(--line);padding:10px 12px;font-size:13px;color:var(--mute)}
.urow .del.arm{background:var(--bad);color:#fff;border-color:transparent;font-weight:700}
.uadd{display:flex;gap:8px;margin-top:6px}
.uadd input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg1);color:var(--text);outline:0}
.uadd input:focus{border-color:var(--acc)}
.umsg{min-height:20px;font-size:13.5px;color:var(--bad);margin:6px 2px 8px}
.uempty{color:var(--mute);font-size:14px;margin:8px 2px}

/* stats */
.stt{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:560px){.stt{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute)}
.sec{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.sec h4{margin:0 0 4px;font-size:15px}
.sec .note{font-size:12px;color:var(--mute);margin:0 0 10px}
.mrow{display:grid;grid-template-columns:1.3fr .6fr 1fr 1.2fr .8fr;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.mrow.hd{border-top:0;color:var(--mute);font-size:12px;padding-top:2px}
.mrow div:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,#a07bff,var(--acc));border-radius:6px 6px 2px 2px;min-height:2px}
.bar small{font-size:10.5px;color:var(--mute);margin-top:4px;white-space:nowrap}
.bar em{font-style:normal;font-size:10.5px;color:var(--mute);margin-bottom:2px}
.rrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rrow:first-of-type{border-top:0}
.rrow .d{color:var(--mute);width:84px;flex:none;font-variant-numeric:tabular-nums}
.rrow .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow .st{color:var(--star);letter-spacing:1px;width:50px;text-align:right;flex:none}
.stmsg{text-align:center;color:var(--mute);padding:26px 10px}
.stmsg .btn{margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">⌨️ <span id="logoT"></span></div>
    <div class="hr">
      <button class="btn ubtn" id="userBtn"></button>
      <div class="seg" id="langSeg">
        <button data-l="ko" class="on">한국어</button>
        <button data-l="en">English</button>
      </div>
    </div>
  </div>
  <div class="regbar" id="regBar" role="alert" hidden><span id="regBarT"></span><button class="btn" id="regBarBtn"></button></div>

  <!-- HOME -->
  <section id="home">
    <div class="hello"><h2 id="hTitle"></h2><p id="hSub"></p></div>
    <div class="cards" id="modeCards"></div>
  </section>

  <!-- PLAY -->
  <!-- STATS -->
  <section id="stats" hidden>
    <div class="top"><button class="btn" id="stBack"></button><div class="ttl" id="stTitle"></div></div>
    <div id="stBody"></div>
  </section>

  <section id="play" hidden>
    <div class="top">
      <button class="btn" id="backBtn"></button>
      <div class="ttl" id="pTitle"></div>
      <div class="cnt" id="pCnt"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="prog"><i id="bar"></i></div>

    <div id="keysPane" hidden>
      <div class="card kp" id="kCard">
        <div class="kbig" id="kBig"></div>
        <div class="kfing"><u id="kDot"></u><span id="kFing"></span></div>
        <div class="kmsg" id="kMsg"></div>
        <div class="kb" id="kb"></div>
      </div>
    </div>

    <div id="textPane" hidden>
      <div class="card" id="tCard">
        <p class="lab" id="labT"></p>
        <div class="line tg" id="tg"></div>
        <div class="srcl" id="srcL"></div>
        <p class="lab" id="labY"></p>
        <div class="ty" id="ty"><div class="line in" id="tyIn" style="min-height:0"></div></div>
        <textarea id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type here"></textarea>
      </div>
      <div class="msg" id="msg"></div>
      <div class="acts">
        <button class="btn fix" id="fixBtn"></button>
        <button class="btn main" id="nextBtn" hidden></button>
        <button class="btn" id="skipBtn"></button>
      </div>
    </div>
  </section>
</div>

<div class="ov" id="uov" hidden>
  <div class="res up">
    <h3 id="uTitle"></h3>
    <div class="sub" id="uSub" style="margin-bottom:6px"></div>
    <div class="ulist" id="uList"></div>
    <form class="uadd" id="uForm" autocomplete="off">
      <input id="uName" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn main" id="uAdd" type="submit"></button>
    </form>
    <div class="umsg" id="uMsg"></div>
    <div class="rb"><button class="btn" id="uGuest" type="button"></button><button class="btn" id="uClose" type="button"></button></div>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <div class="res">
    <div class="stars" id="rStars"></div>
    <h3 id="rTitle"></h3>
    <div class="sub" id="rSub"></div>
    <div class="rs">
      <div><b id="rAcc"></b><span id="rAccL"></span></div>
      <div><b id="rSpd"></b><span id="rSpdL"></span></div>
      <div><b id="rTime"></b><span id="rTimeL"></span></div>
    </div>
    <div class="rb">
      <button class="btn main" id="rRetry"></button>
      <button class="btn" id="rNext"></button>
      <button class="btn" id="rHome"></button>
    </div>
  </div>
</div>

<script>
/* ---------- data ---------- */
const FING = {
  ko:['왼손 새끼손가락','왼손 약지','왼손 중지','왼손 검지','오른손 검지','오른손 중지','오른손 약지','오른손 새끼손가락'],
  en:['Left pinky','Left ring finger','Left middle finger','Left index finger','Right index finger','Right middle finger','Right ring finger','Right pinky']
};
const FCOL = ['#ff9bb5','#ffb77a','#ffd86b','#93e08f','#6fd6dc','#86b6ff','#b9a1ff','#f4a0e3'];
const ROWS = [
  [['KeyQ','q','ㅂ',0],['KeyW','w','ㅈ',1],['KeyE','e','ㄷ',2],['KeyR','r','ㄱ',3],['KeyT','t','ㅅ',3],['KeyY','y','ㅛ',4],['KeyU','u','ㅕ',4],['KeyI','i','ㅑ',5],['KeyO','o','ㅐ',6],['KeyP','p','ㅔ',7]],
  [['KeyA','a','ㅁ',0],['KeyS','s','ㄴ',1],['KeyD','d','ㅇ',2],['KeyF','f','ㄹ',3],['KeyG','g','ㅎ',3],['KeyH','h','ㅗ',4],['KeyJ','j','ㅓ',4],['KeyK','k','ㅏ',5],['KeyL','l','ㅣ',6],['Semicolon',';',';',7]],
  [['KeyZ','z','ㅋ',0],['KeyX','x','ㅌ',1],['KeyC','c','ㅊ',2],['KeyV','v','ㅍ',3],['KeyB','b','ㅠ',3],['KeyN','n','ㅜ',4],['KeyM','m','ㅡ',4]]
];
const KEYMAP = {}, JAMO_REV = {};
ROWS.forEach(r => r.forEach(a => { KEYMAP[a[0]] = {code:a[0], en:a[1], ko:a[2], f:a[3]}; JAMO_REV[a[2]] = a[0]; }));
const toCode = ch => ch === ';' ? 'Semicolon' : 'Key' + ch.toUpperCase();
const KEY_LEVELS = [
  'asdfjkl;'.split('').map(toCode),
  'asdfghjkl;'.split('').map(toCode),
  'qwertyuiop'.split('').map(toCode),
  'zxcvbnm'.split('').map(toCode),
  Object.keys(KEYMAP)
];

const WORDS = {
  ko:[
    ["나라","아이","하나","마리","어머니","오리","이마","아니","언니","한라","안아","알아"],
    ["사랑","하늘","바다","학교","친구","가족","오늘","내일","커피","연습","행복","감사","건강","여행","음악","사과","바람","구름","나무","시장"],
    ["컴퓨터","대한민국","도서관","자동차","선생님","아이스크림","초콜릿","비행기","지하철","놀이공원","텔레비전","키보드","대중교통","고마워요","안녕하세요"]
  ],
  en:[
    ["ask","sad","dad","fall","flag","glad","salad","shall","half","hall","all","gas","glass","flash","dash"],
    ["apple","water","happy","house","music","green","light","table","phone","river","smile","friend","window","garden","summer","bread","chair","clock","dream","sleep"],
    ["keyboard","practice","computer","beautiful","wonderful","chocolate","adventure","elephant","umbrella","notebook","telephone","important","together","tomorrow","breakfast"]
  ]
};
const SENTS = {

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const MAX_USERS = 8, MAX_REC = 1000;
const U = {users: LS.get('tp3_users', []), cur: LS.get('tp3_cur', null)};
if (!Array.isArray(U.users)) U.users = [];
if (U.cur && !U.users.some(u => u.id === U.cur)) U.cur = null;
let guestStars = {};
function curUser(){ return U.users.find(u => u.id === U.cur) || null; }
function saveUsers(){ LS.set('tp3_users', U.users); if (U.cur) LS.set('tp3_cur', U.cur); else LS.del('tp3_cur'); }
function escH(x){ return String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function starsMap(){ return U.cur ? LS.get('tp3_stars_' + U.cur, {}) : guestStars; }
function skey(mode, lvl){ return mode + '_' + S.lang + '_' + lvl; }
function getStars(mode, lvl){ return Number(starsMap()[skey(mode, lvl)]) || 0; }
function setStars(mode, lvl, n){
  const mp = starsMap(), k = skey(mode, lvl);
  if (n > (Number(mp[k]) || 0)){ mp[k] = n; if (U.cur) LS.set('tp3_stars_' + U.cur, mp); }
}
function getRecs(){ return U.cur ? LS.get('tp3_rec_' + U.cur, []) : []; }
function addRec(r){
  if (!U.cur) return;
  const a = getRecs(); a.push(r);
  LS.set('tp3_rec_' + U.cur, a.slice(-MAX_REC));
}
function legacyStars(){
  const mp = {};
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i), m = /^tp2_(keys|words|sents)_(ko|en)_(\d+)$/.exec(k || '');
      if (m){ const n = Number(localStorage.getItem(k)) || 0; if (n) mp[m[1] + '_' + m[2] + '_' + m[3]] = n; }
    }
  } catch(e){}
  return mp;
}
function addUser(name){
  name = name.replace(/\s+/g, ' ').trim().slice(0, 12);
  if (!name) return 'uNeed';
  if (U.users.length >= MAX_USERS) return 'uFull';
  if (U.users.some(u => u.name.toLowerCase() === name.toLowerCase())) return 'uDup';
  const first = U.users.length === 0;
  const u = {id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, created: Date.now()};
  U.users.push(u); U.cur = u.id; saveUsers();
  if (first){ const lg = legacyStars(); if (Object.keys(lg).length) LS.set('tp3_stars_' + u.id, lg); }
  return null;
}
function delUser(id){
  U.users = U.users.filter(u => u.id !== id);
  LS.del('tp3_stars_' + id); LS.del('tp3_rec_' + id);
  if (U.cur === id) U.cur = null;
  saveUsers();
}
function levelCount(mode){ return t().levels[mode].length; }
function starStr(n){ return '★'.repeat(n) + '☆'.repeat(3 - n); }

/* ---------- books (content/*.json, added over time) ---------- */
const BOOKS = {};
function loadBooks(lang){
  if (BOOKS[lang]) return BOOKS[lang];
  BOOKS[lang] = fetch('/content/index.json', {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error('index'); return r.json(); })
    .then(ix => Promise.all(ix.books.filter(b => b.lang === lang).map(b =>
      fetch('/content/' + b.file, {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error(b.file); return r.json(); }))))
    .then(list => { const pool = []; list.forEach(bk => bk.sentences.forEach(x => pool.push({t:x.t, r:x.r}))); if (!pool.length) throw new Error('empty'); return pool; })
    .catch(e => { delete BOOKS[lang]; throw e; });
  return BOOKS[lang];
}

/* ---------- round start ---------- */
function startRound(mode, level){
  S.mode = mode; S.level = level; S.idx = 0; S.t0 = null; S.done = false; S.locked = false;
  S.firstTry = 0; S.missed = false; S.errTotal = 0; S.charTotal = 0; S.strokeDone = 0;
  showView('play');
  $('pTitle').textContent = t().modes[mode][0];
  $('keysPane').hidden = mode !== 'keys';
  $('textPane').hidden = mode === 'keys';
  renderChips();
  if (mode === 'keys'){
    let codes = KEY_LEVELS[level].filter(c => !(S.lang === 'ko' && c === 'Semicolon' && level < 4));
    const seq = []; let pool = [];
    while (seq.length < ROUND.keys){
      if (!pool.length) pool = shuffle(codes);
      const c = pool.pop();
      if (seq.length && seq[seq.length - 1] === c && pool.length) { pool.unshift(c); continue; }
      seq.push(c);
    }
    S.items = seq.map(c => KEYMAP[c]);
    updateProgress(); keyPrompt();
  } else {
    S.refs = null;
    $('srcL').textContent = '';
    if (mode === 'sents' && level === 2){
      const ticket = {}; S.ticket = ticket; S.items = ['']; S.target = '';
      $('nextBtn').hidden = true; $('tg').textContent = ''; $('tyIn').textContent = ''; $('msg').textContent = t().bkLoad; $('msg').className = 'msg';
      loadBooks(S.lang).then(pool => {
        if (S.ticket !== ticket || S.view !== 'play') return;
        const pick = shuffle(pool).slice(0, ROUND.sents);
        S.items = pick.map(x => x.t); S.refs = pick.map(x => x.r);
        updateProgress(); loadItem();
      }).catch(() => { if (S.ticket === ticket) $('msg').textContent = t().bkFail; });
      return;
    }
    S.ticket = null;
    S.items = shuffle(mode === 'words' ? WORDS[S.lang][level] : SENTS[S.lang][level]).slice(0, ROUND[mode]);
    $('nextBtn').hidden = mode !== 'words';
    updateProgress(); loadItem();
  }
}

function updateProgress(){
  const n = S.items.length;
  $('pCnt').textContent = Math.min(S.idx + 1, n) + ' / ' + n;
  $('bar').style.width = (100 * S.idx / n) + '%';
}

  }).join('') + '</div>').join('');

function keyPrompt(){
  const k = S.items[S.idx]; if (!k) return;
  $('kBig').textContent = S.lang === 'ko' ? k.ko : k.en.toUpperCase();

    el.classList.toggle('target', el.dataset.c === k.code);
    el.classList.remove('ok', 'bad');
  });

}

function resolveCode(e){
  if (KEYMAP[e.code]) return e.code;
  const k = e.key; if (!k || k.length !== 1) return null;
  if (/^[a-zA-Z]$/.test(k)) return 'Key' + k.toUpperCase();
  if (k === ';') return 'Semicolon';
  return JAMO_REV[k] || null;
}

function flash(code, cls){
  const el = $('kb').querySelector('[data-c="' + code + '"]');
  if (!el) return; el.classList.remove('ok', 'bad'); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 350);
}

function handleKey(code){
  if (S.view !== 'play' || S.mode !== 'keys' || S.done || !KEYMAP[code]) return;
  const k = S.items[S.idx]; if (!k) return;
  if (!S.t0) S.t0 = performance.now();
  if (code === k.code){
    flash(code, 'ok');
    if (!S.missed) S.firstTry++;
    S.missed = false; S.idx++;
    if (S.idx >= S.items.length){ S.done = true; $('bar').style.width = '100%'; setTimeout(finishKeys, 250); }
    else keyPrompt();
  } else {
    S.missed = true;
    flash(code, 'bad');
    const m = $('kMsg'); m.textContent = t().kWrong; m.className = 'kmsg bad';
    $('kCard').classList.remove('shake'); void $('kCard').offsetWidth; $('kCard').classList.add('shake');
  }
}

function finishKeys(){
  const sec = (performance.now() - S.t0) / 1000;
  const n = S.items.length;
  showResult({acc: Math.round(100 * S.firstTry / n), spd: Math.round(n / (sec / 60)), sec, spdUnit: S.lang === 'ko' ? '키/분' : 'keys/min'});
}

/* ---------- text mode (words / sentences) ---------- */
function loadItem(){
  S.target = S.items[S.idx]; S.errs = new Set(); S.locked = false; S.composing = false;
  $('srcL').textContent = S.refs ? '— ' + S.refs[S.idx] : '';
  setInputRaw('');
  $('nextBtn').classList.remove('pulse'); $('fixBtn').classList.remove('pulse');
  updateProgress();
  render();
}

function setInputRaw(s){
  S.composing = false;
  inp.blur(); inp.value = s; inp.focus({preventScroll:true});
  try { inp.setSelectionRange(s.length, s.length); } catch(e){}
}

function render(){
  const v = inp.value, len = v.length, tg = S.target;
  const committed = S.composing ? len - 1 : len;
  let bad = len > tg.length, anyWrong = false;
  let th = '';
  for (let i = 0; i < tg.length; i++){
    let c = '';
    if (i < len){
      if (S.composing && i === len - 1) c = 'cur';
      else if (v[i] === tg[i]) c = 'ok'; else { c = 'bad'; anyWrong = true; }
    } else if (i === len) c = 'cur';
    th += '<span class="' + c + '">' + esc(tg[i]) + '</span>';
  }
  $('tg').innerHTML = th;
  let yh = '';
  for (let i = 0; i < len; i++){
    let c;
    if (S.composing && i === len - 1) c = 'pend';
    else if (i < tg.length && v[i] === tg[i]) c = 'ok'; else c = 'bad';
    yh += '<span class="' + c + '">' + esc(v[i]) + '</span>';
  }
  $('tyIn').innerHTML = len ? yh + '<span class="caret"></span>' : '<span class="caret"></span><span class="ph">' + t().ph + '</span>';
  const matched = v === tg;
  const hasErr = anyWrong || bad;
  const ty = $('ty'); ty.classList.toggle('good', matched); ty.classList.toggle('err', hasErr);
  const msg = $('msg');
  if (hasErr){ msg.textContent = bad && !anyWrong ? t().extra : t().wrong; msg.className = 'msg bad'; }
  else if (matched){ msg.textContent = S.mode === 'words' ? t().okWord : t().okSent; msg.className = 'msg good'; }
  else if (len){ msg.textContent = t().good; msg.className = 'msg'; }
  else { msg.textContent = t().typing; msg.className = 'msg'; }
  $('fixBtn').classList.toggle('pulse', hasErr);
  $('nextBtn').classList.toggle('pulse', matched && S.mode === 'words');
}

function update(){
  if (S.done || S.locked) return;
  if (!S.target){ if (inp.value) setInputRaw(''); return; }   // books still loading
  let v = inp.value;
  if (S.mode === 'words'){
    const c = v.replace(/\s+$/, '');
    if (c !== v){                       // Space was pressed
      if (c === S.target){ advance(false); return; }
      inp.value = c; v = c;             // ignore early spaces
    }
  }
  if (!S.t0 && v.length > 0) S.t0 = performance.now();
  const committed = S.composing ? v.length - 1 : v.length;
  for (let i = 0; i < committed && i < S.target.length; i++) if (v[i] !== S.target[i]) S.errs.add(i);
  render();
  if (S.mode === 'sents' && v === S.target && !S.composing){
    S.locked = true; $('msg').textContent = t().okSent; setTimeout(() => advance(false), 450);
  }
}

function advance(skipped){
  if (S.done) return;
  if (skipped){ S.errTotal += S.errs.size + 1; S.charTotal += S.target.length; }
  else { S.errTotal += S.errs.size; S.charTotal += S.target.length; S.strokeDone += strokesOf(S.target); }
  S.idx++;
  if (S.idx >= S.items.length){ S.done = true; $('bar').style.width = '100%'; finishText(); return; }
  loadItem();
}

function fix(){
  if (S.locked || S.done) return;
  const v = inp.value; let i = 0;
  while (i < v.length && i < S.target.length && v[i] === S.target[i]) i++;
  if (i === v.length) { render(); return; }      // nothing wrong
  setInputRaw(v.slice(0, i)); update();
}

function finishText(){
  const min = Math.max((performance.now() - S.t0) / 60000, 1 / 600);
  const acc = Math.max(0, Math.round(100 * (1 - S.errTotal / Math.max(1, S.charTotal))));
  showResult({acc, spd: Math.round(S.strokeDone / min), sec: min * 60, spdUnit: t().spd});
}

/* ---------- result ---------- */
function showResult(r){
  const stars = r.acc >= 95 ? 3 : r.acc >= 85 ? 2 : 1;
  setStars(S.mode, S.level, stars);
  addRec({ts: Date.now(), lang: S.lang, mode: S.mode, level: S.level, acc: r.acc, spd: r.spd, sec: Math.round(r.sec * 10) / 10, stars});
  S.lastRes = r;
  $('rStars').innerHTML = '★'.repeat(stars) + '<s>' + '★'.repeat(3 - stars) + '</s>';
  $('rTitle').textContent = t().rTitle[stars - 1];
  $('rSub').textContent = t().rSub[stars - 1];
  $('rAcc').textContent = r.acc + '%'; $('rAccL').textContent = t().acc;
  $('rSpd').textContent = r.spd; $('rSpdL').textContent = r.spdUnit;
  $('rTime').textContent = r.sec.toFixed(1); $('rTimeL').textContent = t().time;
  $('rRetry').textContent = t().again; $('rHome').textContent = t().home;
  const hasNext = S.level + 1 < levelCount(S.mode);
  $('rNext').hidden = !hasNext; $('rNext').textContent = t().nextLv;
  $('ov').hidden = false;
  renderChips();
}

/* ---------- user panel ---------- */
let uArm = null;
function renderUserBtn(){
  const u = curUser();
  $('userBtn').textContent = '👤 ' + (u ? u.name : t().guest);
  $('userBtn').title = t().userBtnT;
  const L = t(), none = !U.users.length;
  $('regBar').hidden = !!u;
  $('regBarT').textContent = none ? L.regNone : L.regPick;
  $('regBarBtn').textContent = none ? L.regNoneBtn : L.regPickBtn;
}
function renderUsers(){
  const L = t();
  if (!U.users.length){ $('uList').innerHTML = '<div class="uempty">' + L.uEmpty + '</div>'; return; }
  $('uList').innerHTML = U.users.map(u =>
    '<div class="urow"><button class="btn pick' + (u.id === U.cur ? ' on' : '') + '" data-id="' + u.id + '"><span>👤 ' + escH(u.name) + '</span>' +
    (u.id === U.cur ? '<em>' + L.uCur + '</em>' : '') + '</button>' +
    '<button class="btn del' + (uArm === u.id ? ' arm' : '') + '" data-del="' + u.id + '">' + (uArm === u.id ? L.uDelSure : L.uDel) + '</button></div>').join('');
  $('uList').querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => { selectUser(b.dataset.id); }));
  $('uList').querySelectorAll('.del').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.del;
    if (uArm === id){ uArm = null; delUser(id); afterUserChange(); renderUsers(); return; }
    uArm = id; renderUsers();
    setTimeout(() => { if (uArm === id){ uArm = null; renderUsers(); } }, 4000);
  }));
}
function openUsers(){ uArm = null; $('uMsg').textContent = ''; $('uName').value = ''; renderUsers(); $('uov').hidden = false; }
function closeUsers(){ $('uov').hidden = true; LS.set('tp3_seen', 1); }
function afterUserChange(){
  renderUserBtn();
  if (S.view === 'play') showView('home');
  renderHome();
  if (S.view === 'stats') renderStats();
}
function selectUser(id){ U.cur = id; saveUsers(); uArm = null; afterUserChange(); closeUsers(); }

/* ---------- stats ---------- */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function dkey(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fmtDur(sec){
  const L = t();
  if (sec < 60) return Math.round(sec) + L.uSec;
  const m = Math.round(sec / 60);
  return m >= 60 ? Math.floor(m / 60) + (S.lang === 'ko' ? '시간 ' : 'h ') + (m % 60) + L.uMin : m + L.uMin;
}
function barsHtml(vals, labels, fmt){
  const mx = Math.max.apply(null, vals.concat([0.0001]));
  return '<div class="bars">' + vals.map((v, i) =>
    '<div class="bar"><em>' + (v ? fmt(v) : '') + '</em><i style="height:' + Math.max(2, Math.round(80 * v / mx)) + 'px"></i><small>' + escH(labels[i]) + '</small></div>').join('') + '</div>';
}
function openStats(){ showView('stats'); renderStats(); }
function renderStats(){
  const L = t(), u = curUser(), body = $('stBody');
  $('stTitle').textContent = (u ? u.name + ' · ' : '') + L.stTitle;
  if (!u){
    body.innerHTML = '<div class="stmsg">' + L.stGuest + '<br><button class="btn main" id="stReg">' + L.stReg + '</button></div>';
    $('stReg').addEventListener('click', openUsers); return;
  }
  const recs = getRecs();
  if (!recs.length){ body.innerHTML = '<div class="stmsg">' + L.stEmpty + '</div>'; return; }
  const n = recs.length;
  const totSec = recs.reduce((a, r) => a + (r.sec || 0), 0);
  const avgAcc = Math.round(recs.reduce((a, r) => a + (r.acc || 0), 0) / n);
  const days = new Set(recs.map(r => dkey(new Date(r.ts)))).size;
  let h = '<div class="stt">' +
    '<div class="tile"><b>' + n + L.uRound + '</b><span>' + L.tRounds + '</span></div>' +
    '<div class="tile"><b>' + fmtDur(totSec) + '</b><span>' + L.tTime + '</span></div>' +
    '<div class="tile"><b>' + avgAcc + '%</b><span>' + L.tAcc + '</span></div>' +
    '<div class="tile"><b>' + days + L.uDay + '</b><span>' + L.tDays + '</span></div></div>';
  // per mode (selected language)
  const mine = recs.filter(r => r.lang === S.lang);
  h += '<div class="sec"><h4>' + L.stByMode + '</h4><p class="note">' + L.stLangNote + '</p>' +
    '<div class="mrow hd"><div></div><div>' + L.cRounds + '</div><div>' + L.cAvg + '</div><div>' + L.cBest + '</div><div>' + L.cClear + '</div></div>';
  ['keys','words','sents'].forEach(m => {
    const a = mine.filter(r => r.mode === m);
    const unit = m === 'keys' ? L.unitKeys : L.spd;
    let cleared = 0; for (let i = 0; i < levelCount(m); i++) if (getStars(m, i) > 0) cleared++;
    h += '<div class="mrow"><div>' + L.modes[m][0] + '</div><div>' + a.length + '</div><div>' +
      (a.length ? Math.round(a.reduce((x, r) => x + r.acc, 0) / a.length) + '%' : '-') + '</div><div>' +
      (a.length ? Math.max.apply(null, a.map(r => r.spd)) + ' ' + unit : '-') + '</div><div>' + cleared + '/' + levelCount(m) + '</div></div>';
  });
  h += '</div>';
  // last 7 days
  const vals = [], labs = [], today = new Date();
  const perDay = {}; recs.forEach(r => { const k = dkey(new Date(r.ts)); perDay[k] = (perDay[k] || 0) + (r.sec || 0); });
  for (let i = 6; i >= 0; i--){
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
    vals.push(Math.round((perDay[dkey(d)] || 0) / 6) / 10); labs.push((d.getMonth() + 1) + '/' + d.getDate());
  }
  h += '<div class="sec"><h4>' + L.stWeek + '</h4>' + barsHtml(vals, labs, v => v) + '</div>';
  // accuracy trend (last 12)
  const last = recs.slice(-12);
  h += '<div class="sec"><h4>' + L.stTrend + '</h4>' + barsHtml(last.map(r => r.acc), last.map((r, i) => String(n - last.length + i + 1)), v => v) + '</div>';
  // recent 10
  h += '<div class="sec"><h4>' + L.stRecent + '</h4>' + recs.slice(-10).reverse().map(r => {
    const d = new Date(r.ts), lv = (T[r.lang] || L).levels[r.mode][r.level] || '';
    const unit = r.mode === 'keys' ? (T[r.lang] || L).unitKeys : (T[r.lang] || L).spd;
    return '<div class="rrow"><div class="d">' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + '</div>' +
      '<div class="w">' + (r.lang === 'ko' ? '한 ' : 'EN ') + (T[r.lang] || L).modes[r.mode][0] + ' · ' + escH(lv) + '</div>' +
      '<div class="n">' + r.acc + '% · ' + r.spd + unit + '</div><div class="st">' + '★'.repeat(r.stars || 0) + '</div></div>';
  }).join('') + '</div>';
  body.innerHTML = h;
}

/* ---------- events ---------- */
inp.addEventListener('compositionstart', () => { S.composing = true; });
inp.addEventListener('compositionend', () => { S.composing = false; update(); });
inp.addEventListener('input', update);
inp.addEventListener('paste', e => e.preventDefault());
inp.addEventListener('drop', e => e.preventDefault());
inp.addEventListener('focus', () => card.classList.add('focus'));
inp.addEventListener('blur', () => card.classList.remove('focus'));
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    e.preventDefault();
    if (S.mode === 'words') setTimeout(() => { if (!S.done && !S.locked && inp.value === S.target) advance(false); }, 40);
  } else if (e.key === 'Escape'){ e.preventDefault(); setInputRaw(''); update(); }
});

document.addEventListener('keydown', e => {
  if (S.view !== 'play' || e.ctrlKey || e.metaKey || e.altKey || !$('ov').hidden || !$('uov').hidden) return;
  if (S.mode === 'keys'){
    if (e.repeat) return;
    const c = resolveCode(e);
    if (c){ e.preventDefault(); handleKey(c); }
  } else if (document.activeElement !== inp){
    inp.focus({preventScroll:true});
  }
});

$('fixBtn').addEventListener('click', fix);
$('skipBtn').addEventListener('click', () => advance(true));
$('nextBtn').addEventListener('click', () => {
  if (S.done || S.locked) return;
  if (inp.value.replace(/\s+$/, '') === S.target) advance(false); else { inp.focus({preventScroll:true}); }
});
$('backBtn').addEventListener('click', () => { showView('home'); renderHome(); });
$('rRetry').addEventListener('click', () => startRound(S.mode, S.level));
$('rNext').addEventListener('click', () => startRound(S.mode, S.level + 1));
$('rHome').addEventListener('click', () => { showView('home'); renderHome(); });
card.addEventListener('click', () => inp.focus({preventScroll:true}));

document.querySelectorAll('#langSeg button').forEach(b => b.addEventListener('click', () => {
  S.lang = b.dataset.l;
  document.querySelectorAll('#langSeg button').forEach(x => x.classList.toggle('on', x === b));
  applyLang();
  if (S.view === 'play') startRound(S.mode, Math.min(S.level, levelCount(S.mode) - 1));
}));

$('stBack').addEventListener('click', () => { showView('home'); renderHome(); });
$('userBtn').addEventListener('click', openUsers);
$('regBarBtn').addEventListener('click', openUsers);
$('uClose').addEventListener('click', closeUsers);
$('uGuest').addEventListener('click', () => { U.cur = null; saveUsers(); closeUsers(); afterUserChange(); });
$('uov').addEventListener('click', e => { if (e.target === $('uov')) closeUsers(); });
$('uForm').addEventListener('submit', e => {
  e.preventDefault();
  const err = addUser($('uName').value);
  if (err){ $('uMsg').textContent = t()[err]; return; }
  $('uName').value = ''; $('uMsg').textContent = '';
  afterUserChange(); closeUsers();
});

try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
applyLang();
showView('home');
if (!U.users.length && !LS.get('tp3_seen', 0)) openUsers();
</script>
